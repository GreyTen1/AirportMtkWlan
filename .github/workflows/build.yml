name: Build Kexts

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AirportMtkWlan & SimpleMtkWlan
    runs-on: macos-15
    steps:
      - name: Checkout repository (with MacKernelSDK submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain info
        run: |
          xcodebuild -version
          clang --version | head -1

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/.*MODULE_VERSION = \([0-9.]*\);.*/\1/p' SimpleMtkWlan.xcodeproj/project.pbxproj | head -1)"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Invalid kext version '$VERSION' (use tags like v1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Run host tests
        run: ./tests/run-all.sh

      - name: Build SimpleMtkWlan (Debug & Release)
        run: |
          for CONF in Debug Release; do
            MODULE_VERSION="${{ steps.ver.outputs.version }}" \
              ./build-macos.sh "$CONF" SimpleMtkWlan
          done

      - name: Build AirportMtkWlan (Tahoe & Sequoia, Debug & Release)
        run: |
          for CONF in Debug Release; do
            for OS in tahoe sequoia; do
              AIRPORT_OS="$OS" MODULE_VERSION="${{ steps.ver.outputs.version }}" \
                ./build-macos.sh "$CONF" AirportMtkWlan
            done
          done

      - name: Package artifacts
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          for CONF in Debug Release; do
            UP="$(echo "$CONF" | tr '[:lower:]' '[:upper:]')"
            ditto -c -k --sequesterRsrc --keepParent \
              "build/$CONF/SimpleMtkWlan.kext" \
              "dist/SimpleMtkWlan-v$V-$UP.zip"
            for OS in tahoe sequoia; do
              OSN="$(echo "${OS:0:1}" | tr '[:lower:]' '[:upper:]')${OS:1}"
              ditto -c -k --sequesterRsrc --keepParent \
                "build/$CONF/$OS/AirportMtkWlan.kext" \
                "dist/AirportMtkWlan-$OSN-v$V-$UP.zip"
            done
          done
          cp tools/mtklog.sh dist/
          (cd dist && shasum -a 256 *.zip > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload kext artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirportMtkWlan-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short }}
          path: |
            dist/*.zip
            dist/mtklog.sh
            dist/SHA256SUMS.txt
            build/Release/tahoe/AirportMtkWlan.kext
            build/Release/sequoia/AirportMtkWlan.kext
            build/Release/SimpleMtkWlan.kext

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/mtklog.sh
            dist/SHA256SUMS.txt
          generate_release_notes: true
